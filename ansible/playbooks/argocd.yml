# Bootstrap only. Installs Argo CD once so that Argo CD can take over managing
# itself (k8s/apps/argo-cd.yaml), then hands it the app-of-apps root.
#
# Deliberately `helm template | kubectl apply` rather than `helm install`: it
# leaves no Helm release for Argo to fight over ownership with, and the chart
# and values are the same ones k8s/apps/argo-cd.yaml renders, so the first
# self-managed sync is a no-op rather than a churn of replacements.
#
# Re-running this is both idempotent and the documented recovery path for a
# values change that breaks the controller that would otherwise roll it back.

- name: Argo CD bootstrap
  hosts: gpu_host
  become: false

  vars:
    argocd_chart_version: "10.9.2"
    argocd_namespace: argocd
    repo_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Add the Argo Helm repository
      ansible.builtin.command:
        cmd: helm repo add argo https://argoproj.github.io/argo-helm --force-update
      changed_when: false

    - name: Refresh Helm repository metadata
      ansible.builtin.command:
        cmd: helm repo update argo
      changed_when: false

    - name: Create the argocd namespace
      ansible.builtin.command:
        cmd: kubectl create namespace {{ argocd_namespace }} --dry-run=client -o yaml
      changed_when: false
      register: argocd_ns

    - name: Apply the argocd namespace
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ argocd_ns.stdout }}"
      register: argocd_ns_apply
      changed_when: "'unchanged' not in argocd_ns_apply.stdout"

    - name: Render and apply the Argo CD chart
      # Server-side apply is required, not stylistic: the Application CRD is
      # larger than the 262144-byte annotation client-side apply writes into.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          helm template argocd argo/argo-cd
          --version {{ argocd_chart_version }}
          --namespace {{ argocd_namespace }}
          --include-crds
          --values {{ repo_root }}/k8s/values/argo-cd.yaml
          | kubectl apply --server-side --force-conflicts -n {{ argocd_namespace }} -f -
        executable: /bin/bash
      register: argocd_apply
      changed_when: >-
        argocd_apply.stdout_lines
        | reject('search', ' unchanged$')
        | list
        | length > 0

    - name: Wait for the Argo CD server
      ansible.builtin.command:
        cmd: >-
          kubectl rollout status deployment/argocd-server
          -n {{ argocd_namespace }} --timeout=300s
      changed_when: false

    - name: Wait for the application controller
      ansible.builtin.command:
        cmd: >-
          kubectl rollout status statefulset/argocd-application-controller
          -n {{ argocd_namespace }} --timeout=300s
      changed_when: false

    - name: Apply the app-of-apps root
      ansible.builtin.command:
        cmd: kubectl apply -f {{ repo_root }}/k8s/root.yaml
      register: argocd_root
      changed_when: "'unchanged' not in argocd_root.stdout"

    - name: Read the initial admin password
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret
          -o jsonpath={.data.password}
      changed_when: false
      failed_when: false
      register: argocd_admin

    - name: Show how to reach the UI
      ansible.builtin.debug:
        msg:
          - "kubectl port-forward svc/argocd-server -n {{ argocd_namespace }} 8080:80"
          - "user: admin"
          - >-
            password:
            {{ (argocd_admin.stdout | b64decode)
               if argocd_admin.rc == 0 and argocd_admin.stdout | length > 0
               else 'already rotated - argocd-initial-admin-secret is gone' }}
