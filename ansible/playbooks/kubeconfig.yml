- name: Kubeconfig for the host
  hosts: servers

  tasks:
    - name: Read the admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig

    - name: Write it to ~/.kube/config on the host, pointed at the server
      ansible.builtin.copy:
        content: >-
          {{ k3s_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' ~ ansible_host ~ ':6443') }}
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        mode: "0600"
      delegate_to: localhost
      become: false
