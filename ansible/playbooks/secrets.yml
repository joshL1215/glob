# Secrets that must exist before Argo syncs the apps that consume them

- name: Cluster bootstrap secrets
  hosts: gpu_host
  become: false

  vars:
    observability_namespace: observability

  tasks:
    - name: Create the observability namespace
      # Argo would create this itself via CreateNamespace=true, but the secret
      # has to exist before Grafana starts, which means before Argo gets there.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          kubectl create namespace {{ observability_namespace }}
          --dry-run=client -o yaml | kubectl apply -f -
        executable: /bin/bash
      register: observability_ns
      changed_when: "'unchanged' not in observability_ns.stdout"

    - name: Look for an existing Grafana admin secret
      ansible.builtin.command:
        cmd: kubectl -n {{ observability_namespace }} get secret grafana-admin
      register: grafana_secret
      failed_when: false
      changed_when: false

    - name: Generate the Grafana admin secret
      # `lookup('password', '/dev/null ...')` generates without storing a copy
      # on the controller. no_log keeps it out of Ansible output and other logs
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ observability_namespace }}"
          - create
          - secret
          - generic
          - grafana-admin
          - --from-literal=admin-user=admin
          - >-
            --from-literal=admin-password={{
              lookup('password', '/dev/null length=24 chars=ascii_letters,digits')
            }}
      when: grafana_secret.rc != 0
      no_log: true

    - name: Say where the password lives
      ansible.builtin.debug:
        msg: >-
          Grafana admin password:
          kubectl -n {{ observability_namespace }} get secret grafana-admin
          -o jsonpath='{.data.admin-password}' | base64 -d
