# Loaded by the Grafana sidecar, which watches every namespace for ConfigMaps
# carrying the grafana_dashboard label. Edit this file and push — anything
# changed in the Grafana UI lives only in its PVC and dies on a lab rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-lab-capacity
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Lab
data:
  lab-capacity.json: |
    {
      "title": "Lab capacity",
      "uid": "lab-capacity",
      "tags": [
        "lab"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "Capacity",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Available worker memory",
          "description": "Unreserved memory on lab-w1 and lab-w2. Decides whether a new workload fits. glob and lab-cp-1 are left out because both are tainted, so ordinary pods cannot land there.",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_allocatable{resource=\"memory\",node=~\"lab-w1|lab-w2\"} - on(node) group_left() sum by(node) (kube_pod_container_resource_requests{resource=\"memory\"}))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 536870912
                  },
                  {
                    "color": "green",
                    "value": 1610612736
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "area",
            "colorMode": "value",
            "justifyMode": "auto"
          }
        },
        {
          "type": "bargauge",
          "title": "Free memory by node",
          "description": "Allocatable minus what pods have reserved. Not the same as unused memory \u2014 the scheduler only counts reservations.",
          "gridPos": {
            "h": 6,
            "w": 9,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_node_status_allocatable{resource=\"memory\"} - on(node) group_left() sum by(node) (kube_pod_container_resource_requests{resource=\"memory\"})",
              "legendFormat": "{{node}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 2,
              "min": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 268435456
                  },
                  {
                    "color": "green",
                    "value": 1073741824
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "minVizWidth": 8,
            "minVizHeight": 16,
            "valueMode": "color"
          }
        },
        {
          "type": "bargauge",
          "title": "Free CPU by node",
          "description": "Cores not reserved. Overcommitting CPU makes things slow rather than killing them, so this matters less than memory.",
          "gridPos": {
            "h": 6,
            "w": 9,
            "x": 15,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_node_status_allocatable{resource=\"cpu\"} - on(node) group_left() sum by(node) (kube_pod_container_resource_requests{resource=\"cpu\"})",
              "legendFormat": "{{node}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "min": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.5
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "minVizWidth": 8,
            "minVizHeight": 16,
            "valueMode": "color"
          }
        },
        {
          "type": "row",
          "title": "GPU",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Available GPU memory",
          "description": "Free VRAM on the RTX 3060. Separate from system memory \u2014 this is the 6 GB on the card, and it is what limits model size.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_FB_FREE"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "mbytes",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1024
                  },
                  {
                    "color": "green",
                    "value": 2048
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "area",
            "colorMode": "value",
            "justifyMode": "auto"
          }
        },
        {
          "type": "gauge",
          "title": "GPU utilisation",
          "description": "How busy the card is. Sits at 0 unless something is actually running on it.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_GPU_UTIL"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#8E8E8E",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "type": "stat",
          "title": "GPU temperature",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_GPU_TEMP"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "area",
            "colorMode": "value",
            "justifyMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "GPU power",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_POWER_USAGE"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#3274D9"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "area",
            "colorMode": "value",
            "justifyMode": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "GPU utilisation over time",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_GPU_UTIL",
              "legendFormat": "utilisation"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "color": {
                "mode": "fixed",
                "fixedColor": "#3274D9"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 20,
                "showPoints": "never",
                "pointSize": 8,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false,
              "calcs": []
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        },
        {
          "type": "row",
          "title": "glob memory",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Current",
          "description": "glob is the hypervisor and a cluster node at once, so `kubectl top node glob` is misleading \u2014 it counts the VMs. These are the three real consumers. The VM figure is fixed: qemu claims its full allocation whether guests are busy or idle.",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "VMs + host OS",
              "expr": "(node_memory_MemTotal_bytes and on(instance) node_uname_info{nodename=\"glob\"}) - (node_memory_MemAvailable_bytes and on(instance) node_uname_info{nodename=\"glob\"}) - scalar(sum(container_memory_working_set_bytes{node=\"glob\",container!=\"\"}))"
            },
            {
              "refId": "B",
              "legendFormat": "Kubernetes pods",
              "expr": "sum(container_memory_working_set_bytes{node=\"glob\",container!=\"\"})"
            },
            {
              "refId": "C",
              "legendFormat": "Available",
              "expr": "node_memory_MemAvailable_bytes and on(instance) node_uname_info{nodename=\"glob\"}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "VMs + host OS"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3274D9"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Kubernetes pods"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#E0752D"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Available"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#8E8E8E"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "graphMode": "none",
            "colorMode": "value",
            "orientation": "horizontal",
            "justifyMode": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "Over time",
          "description": "Stacked to the full 15 GiB. 'Available' includes reclaimable cache, which is why the 'free' figure elsewhere looks small and does not matter.",
          "gridPos": {
            "h": 7,
            "w": 16,
            "x": 8,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "VMs + host OS",
              "expr": "(node_memory_MemTotal_bytes and on(instance) node_uname_info{nodename=\"glob\"}) - (node_memory_MemAvailable_bytes and on(instance) node_uname_info{nodename=\"glob\"}) - scalar(sum(container_memory_working_set_bytes{node=\"glob\",container!=\"\"}))"
            },
            {
              "refId": "B",
              "legendFormat": "Kubernetes pods",
              "expr": "sum(container_memory_working_set_bytes{node=\"glob\",container!=\"\"})"
            },
            {
              "refId": "C",
              "legendFormat": "Available",
              "expr": "node_memory_MemAvailable_bytes and on(instance) node_uname_info{nodename=\"glob\"}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 70,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "showPoints": "never",
                "pointSize": 8,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "VMs + host OS"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3274D9"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Kubernetes pods"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#E0752D"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Available"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#8E8E8E"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "type": "row",
          "title": "Usage",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "table",
          "title": "Top pods by memory",
          "description": "Actual memory in use, not reservations. A pod well above its request is the first thing killed when a node runs short.",
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "topk(15, sum by(node, namespace, pod) (container_memory_working_set_bytes{container!=\"\"}))"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "Memory",
                  "node": "Node",
                  "namespace": "Namespace",
                  "pod": "Pod"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Memory",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "custom": {
                "align": "auto",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Memory"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "gradient"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "continuous-BlYlRd"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 320
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "footer": {
              "show": false
            }
          }
        }
      ]
    }
