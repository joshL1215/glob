# GPU telemetry: utilisation, memory, temperature, per-pod attribution
# only for GPU node

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dcgm-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default

  sources:
    - repoURL: https://nvidia.github.io/dcgm-exporter/helm-charts
      chart: dcgm-exporter
      targetRevision: 4.8.4
      helm:
        releaseName: dcgm-exporter
        valueFiles:
          - $values/k8s/values/dcgm-exporter.yaml
    - repoURL: https://github.com/joshL1215/glob.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
