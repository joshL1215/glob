apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1

  # vLLM reserves all its VRAM at startup, so two pods cannot overlap.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: vllm

  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      runtimeClassName: nvidia

      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.30.0
          imagePullPolicy: IfNotPresent

          args:
            - --model=Qwen/Qwen2.5-0.5B-Instruct
            - --served-model-name=qwen-0.5b
            - --host=0.0.0.0
            - --port=8000

            - --gpu-memory-utilization=0.42

            - --max-model-len=8192
            - --max-num-seqs=8

            - --enforce-eager

          env:
            - name: HF_HOME
              value: /models
            - name: VLLM_LOGGING_LEVEL
              value: INFO

          ports:
            - name: http
              containerPort: 8000

          resources:
            requests:
              cpu: 500m
              memory: 1500Mi
            limits:
              memory: 3Gi
              nvidia.com/gpu: 1

          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm

          # First boot downloads weights and compiles; later boots read the PVC.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models

        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
